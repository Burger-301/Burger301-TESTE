<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Burger 301</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            height: fit-content;
        }
        h2 { color: #f28c28; text-align: center; margin-bottom: 20px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f28c28;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #d96f0c; }
        .painel-conteudo { display: none; }
        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn-status {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            width: auto;
        }
        .ativo { background-color: #22c55e; color: white; } /* Verde */
        .inativo { background-color: #ef4444; color: white; } /* Vermelho */
        
        .secao-painel {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .secao-painel h3 { color: #f28c28; margin-top: 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        .lista-admin-produtos {
            max-height: 280px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .item-admin-produto {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .item-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .item-botoes {
            display: flex;
            gap: 5px;
        }
        .msg { text-align: center; margin-top: 10px; font-size: 14px; color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="tela-login">
            <h2>🔒 Área Restrita</h2>
            <div class="campo">
                <label for="senha">Palavra-passe:</label>
                <input type="password" id="senha" placeholder="Digite a senha">
            </div>
            <button id="btn-entrar">Entrar no Painel</button>
            <p id="erro-login" style="color: #ef4444; text-align: center; margin-top: 10px; font-size: 14px;"></p>
        </div>

        <!-- PAINEL DE CONTROLE -->
        <div id="painel-controle" class="painel-conteudo">
            <h2>⚙️ Painel Burger 301</h2>
            
            <!-- STATUS DA LOJA -->
            <div class="status-box">
                <span>Status da Loja:</span>
                <button id="btn-toggle-loja" class="btn-status ativo">Aberto</button>
            </div>

            <!-- ADICIONAR / EDITAR PRODUTO -->
            <div class="secao-painel">
                <h3 id="titulo-form-produto">➕ Adicionar Novo Produto</h3>
                <input type="hidden" id="edit-id" value="">
                <div class="campo">
                    <label>Nome do Produto:</label>
                    <input type="text" id="novo-nome" placeholder="Ex: Burger Especial">
                </div>
                <div class="campo">
                    <label>Categoria:</label>
                    <select id="novo-categoria">
                        <option value="hamburgueres">Hambúrgueres</option>
                        <option value="porcoes">Porções</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Preço (R$):</label>
                    <input type="text" id="novo-preco" placeholder="Ex: 35.00">
                </div>
                <div class="campo">
                    <label>Descrição:</label>
                    <textarea id="novo-descricao" rows="2" placeholder="Ingredientes..."></textarea>
                </div>
                <div class="campo">
                    <label>Imagem (Nome do ficheiro):</label>
                    <input type="text" id="novo-imagem" placeholder="Ex: imagens/duchef.jpg" value="imagens/">
                </div>
                <button id="btn-salvar-produto">Cadastrar Produto</button>
                <button id="btn-cancelar-edicao" style="background: #555; margin-top: 8px; display: none;">Cancelar Edição</button>
            </div>

            <!-- GESTÃO DE ESTOQUE / DISPONIBILIDADE / EDITAR / EXCLUIR -->
            <div class="secao-painel">
                <h3>📦 Gerenciar Produtos</h3>
                <p style="font-size: 12px; color: #aaa; margin-top: 0;">Alterne a disponibilidade, edite ou exclua produtos:</p>
                <div id="lista-gestao-produtos" class="lista-admin-produtos">
                    <p style="font-size: 13px; color: #777;">A carregar produtos...</p>
                </div>
            </div>

            <p id="msg-sucesso" class="msg"></p>
            <button id="btn-sair" style="background-color: #444; margin-top: 10px;">Sair</button>
        </div>
    </div>

    <!-- SCRIPT DO PAINEL ADMIN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, addDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJlQENhh8DbqYLyTl4zwvyqLGRAIMz87Y",
            authDomain: "burger301-79148.firebaseapp.com",
            projectId: "burger301-79148",
            storageBucket: "burger301-79148.firebasestorage.app",
            messagingSenderId: "681050351563",
            appId: "1:681050351563:web:7712d7ef3911365a2f784e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const SENHA_ADMIN = "burger301adm"; 

        const telaLogin = document.getElementById("tela-login");
        const painelControle = document.getElementById("painel-controle");
        const inputSenha = document.getElementById("senha");
        const btnEntrar = document.getElementById("btn-entrar");
        const erroLogin = document.getElementById("erro-login");
        const btnToggleLoja = document.getElementById("btn-toggle-loja");
        const msgSucesso = document.getElementById("msg-sucesso");
        const btnSair = document.getElementById("btn-sair");

        btnEntrar.addEventListener("click", () => {
            if (inputSenha.value === SENHA_ADMIN) {
                telaLogin.style.display = "none";
                painelControle.style.display = "block";
                iniciarOuvintesAdmin();
            } else {
                erroLogin.textContent = "Palavra-passe incorreta!";
            }
        });

        btnSair.addEventListener("click", () => {
            painelControle.style.display = "none";
            telaLogin.style.display = "block";
            inputSenha.value = "";
            erroLogin.textContent = "";
        });

        const docRefConfig = doc(db, "configuracoes", "loja");
        
        function iniciarOuvintesAdmin() {
            // Ouve status da loja em tempo real
            onSnapshot(docRefConfig, async (docSnap) => {
                if (docSnap.exists()) {
                    atualizarBotaoLoja(docSnap.data().aberto);
                } else {
                    await setDoc(docRefConfig, { aberto: true });
                    atualizarBotaoLoja(true);
                }
            }, (error) => {
                console.error("Erro config:", error);
            });

            // Ouve lista de produtos em tempo real com tratamento de erro
            onSnapshot(collection(db, "produtos"), (snapshot) => {
                renderizarListaAdmin(snapshot);
            }, (error) => {
                console.error("Erro produtos:", error);
                document.getElementById("lista-gestao-produtos").innerHTML = "<p style='font-size:13px; color:#ef4444;'>Erro de permissão no Firebase. Verifique as Regras de Segurança do Firestore.</p>";
            });
        }

        function atualizarBotaoLoja(aberto) {
            if (aberto) {
                btnToggleLoja.textContent = "Aberto";
                btnToggleLoja.className = "btn-status ativo"; // Verde
            } else {
                btnToggleLoja.textContent = "Fechado";
                btnToggleLoja.className = "btn-status inativo"; // Vermelho
            }
        }

        btnToggleLoja.addEventListener("click", async () => {
            const docSnap = await getDoc(docRefConfig);
            const estadoAtual = docSnap.exists() ? docSnap.data().aberto : true;
            const novoEstado = !estadoAtual;
            await updateDoc(docRefConfig, { aberto: novoEstado });
            mostrarAviso(novoEstado ? "Loja aberta com sucesso!" : "Loja fechada com sucesso!");
        });

        const btnSalvarProduto = document.getElementById("btn-salvar-produto");
        const btnCancelarEdicao = document.getElementById("btn-cancelar-edicao");
        const tituloFormProduto = document.getElementById("titulo-form-produto");
        const editIdInput = document.getElementById("edit-id");

        btnSalvarProduto.addEventListener("click", async () => {
            const idEdicao = editIdInput.value;
            const nome = document.getElementById("novo-nome").value.trim();
            const categoria = document.getElementById("novo-categoria").value;
            const preco = parseFloat(document.getElementById("novo-preco").value.replace(",", "."));
            const descricao = document.getElementById("novo-descricao").value.trim();
            const imagem = document.getElementById("novo-imagem").value.trim() || "imagens/icone.png";

            if (!nome || isNaN(preco)) {
                alert("Preencha o nome e um preço válido.");
                return;
            }

            if (idEdicao) {
                await updateDoc(doc(db, "produtos", idEdicao), {
                    nome, categoria, preco, descricao, imagem
                });
                mostrarAviso("Produto atualizado com sucesso!");
                limparFormulario();
            } else {
                await addDoc(collection(db, "produtos"), {
                    nome, categoria, preco, descricao, imagem, esgotado: false
                });
                mostrarAviso("Produto adicionado com sucesso!");
                limparFormulario();
            }
        });

        btnCancelarEdicao.addEventListener("click", () => {
            limparFormulario();
        });

        function limparFormulario() {
            editIdInput.value = "";
            document.getElementById("novo-nome").value = "";
            document.getElementById("novo-preco").value = "";
            document.getElementById("novo-descricao").value = "";
            document.getElementById("novo-imagem").value = "imagens/";
            tituloFormProduto.textContent = "➕ Adicionar Novo Produto";
            btnSalvarProduto.textContent = "Cadastrar Produto";
            btnCancelarEdicao.style.display = "none";
        }

        function renderizarListaAdmin(snapshot) {
            const listaDiv = document.getElementById("lista-gestao-produtos");
            listaDiv.innerHTML = "";

            if (snapshot.empty) {
                listaDiv.innerHTML = "<p style='font-size:13px; color:#aaa;'>Nenhum produto cadastrado.</p>";
                return;
            }

            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const id = docSnap.id;

                const item = document.createElement("div");
                item.className = "item-admin-produto";
                item.innerHTML = `
                    <div class="item-topo">
                        <span><b>${p.nome}</b> — R$ ${Number(p.preco).toFixed(2)} (${p.categoria})</span>
                    </div>
                    <div class="item-botoes">
                        <button class="btn-status ${p.esgotado ? 'inativo' : 'ativo'}" style="padding: 6px 8px; font-size: 11px; flex: 1;" data-acao="toggle" data-id="${id}" data-esgotado="${p.esgotado}">
                            ${p.esgotado ? '🔴 Esgotado' : '🟢 Disponível'}
                        </button>
                        <button style="background: #3b82f6; padding: 6px 8px; font-size: 11px; border-radius:4px; border:none; color:white; cursor:pointer;" data-acao="editar" data-id="${id}" data-nome="${encodeURIComponent(p.nome)}" data-cat="${p.categoria}" data-preco="${p.preco}" data-desc="${encodeURIComponent(p.descricao || '')}" data-img="${encodeURIComponent(p.imagem || '')}">✏️ Editar</button>
                        <button style="background: #ef4444; padding: 6px 8px; font-size: 11px; border-radius:4px; border:none; color:white; cursor:pointer;" data-acao="apagar" data-id="${id}">🗑️ Excluir</button>
                    </div>
                `;
                listaDiv.appendChild(item);
            });

            listaDiv.querySelectorAll("button[data-acao]").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    const acao = e.target.dataset.acao;
                    const id = e.target.dataset.id;

                    if (acao === "toggle") {
                        const esgotadoAtual = e.target.dataset.esgotado === "true";
                        await updateDoc(doc(db, "produtos", id), { esgotado: !esgotadoAtual });
                    } else if (acao === "apagar") {
                        if (confirm("Tem certeza que deseja excluir este produto?")) {
                            await deleteDoc(doc(db, "produtos", id));
                            mostrarAviso("Produto excluído com sucesso!");
                        }
                    } else if (acao === "editar") {
                        editIdInput.value = id;
                        document.getElementById("novo-nome").value = decodeURIComponent(e.target.dataset.nome);
                        document.getElementById("novo-categoria").value = e.target.dataset.cat;
                        document.getElementById("novo-preco").value = e.target.dataset.preco;
                        document.getElementById("novo-descricao").value = decodeURIComponent(e.target.dataset.desc);
                        document.getElementById("novo-imagem").value = decodeURIComponent(e.target.dataset.img);

                        tituloFormProduto.textContent = "✏️ Editar Produto";
                        btnSalvarProduto.textContent = "Salvar Alterações";
                        btnCancelarEdicao.style.display = "block";
                        
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    }
                });
            });
        }

        function mostrarAviso(texto) {
            msgSucesso.textContent = texto;
            setTimeout(() => msgSucesso.textContent = "", 2500);
        }
    </script>
</body>
</html>
